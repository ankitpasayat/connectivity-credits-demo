# Public synthetic-data demo. Coolify owns HTTPS routing and generates passwords.
# No host ports: only the api service receives a domain in Coolify.
services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    environment:
      POSTGRES_USER: connectivity_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_ADMIN}
      CONNECTIVITY_POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_APP}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-container-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U connectivity_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 256
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 67108864
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, localhost:9092]
      interval: 30s
      timeout: 20s
      start_period: 60s
      retries: 6
    logging: *bounded-logs

  api:
    build: .
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    environment:
      NODE_OPTIONS: --max-old-space-size=192
      CONNECTIVITY_PUBLIC_DEMO: "true"
      CONNECTIVITY_TRANSPORT: kafka
      CONNECTIVITY_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONNECTIVITY_KAFKA_TOPIC: connectivity-measurements-v1
      CONNECTIVITY_KAFKA_GROUP_ID: connectivity-credits-demo
      CONNECTIVITY_KAFKA_TIMEOUT_SECONDS: 12
      DATABASE_URL: postgresql://connectivity_app:${SERVICE_PASSWORD_64_APP}@postgres:5432/connectivity_credits
      CONNECTIVITY_DB_SCHEMA: public
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging: *bounded-logs

volumes:
  postgres-data:
  kafka-data:
