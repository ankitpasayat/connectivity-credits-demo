name: connectivity-credits

services:
  postgres:
    image: postgres:16-bookworm
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: connectivity_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${CONNECTIVITY_POSTGRES_ADMIN_PASSWORD:?Use --env-file .data/postgres/compose.env}
      CONNECTIVITY_POSTGRES_PASSWORD: ${CONNECTIVITY_POSTGRES_PASSWORD:?Use --env-file .data/postgres/compose.env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-container-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectivity_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 15s
      start_period: 30s
      retries: 8

  api:
    image: connectivity-credits-demo:local
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment: &app-environment
      CONNECTIVITY_TRANSPORT: kafka
      CONNECTIVITY_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONNECTIVITY_KAFKA_TOPIC: connectivity-measurements-v1
      CONNECTIVITY_KAFKA_GROUP_ID: connectivity-credits-demo
      CONNECTIVITY_KAFKA_TIMEOUT_SECONDS: 12
      DATABASE_URL: postgresql://connectivity_app:${CONNECTIVITY_POSTGRES_PASSWORD:?Use private compose.env}@postgres:5432/connectivity_credits
      CONNECTIVITY_DB_SCHEMA: public
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Optional continuous consumption. Omit this profile for the guided UI demo,
  # where Run worker and Retry make every processing step visible.
  worker:
    profiles: [background-worker]
    image: connectivity-credits-demo:local
    build: .
    command: ["node", "server/dist/worker.js"]
    environment: *app-environment
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  kafka-data:
  postgres-data:

